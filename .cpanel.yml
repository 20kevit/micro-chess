# MicroChess cPanel Git deployment (prebuilt frontend + Passenger backend).
#
# Push-deployment model (the model cPanel officially prefers over pull):
#   local: npm ci && npm run build (+ tests) → git commit → git push
#   → cPanel-managed repository receives via post-receive hook
#   → the tasks below run with the clone as working directory
#   → production application under $DEPLOYPATH.
#
# Production layout for account `kevitir` (operator-confirmed values;
# see docs/platform/CPANEL_DEPLOYMENT.md):
#   Git clone (cPanel-managed, DO NOT deploy into it):
#     /home/kevitir/repositories/micro-chess
#   Deployment root:
#     /home/kevitir/microchess
#   Python Application Root (cPanel "Setup Python App"):
#     /home/kevitir/microchess/backend
#   Startup File (relative to the Application Root):
#     passenger_wsgi.py
#   Entry Point (WSGI callable):
#     application
#   Python virtualenv (operator-confirmed):
#     /home/kevitir/virtualenv/microchess/backend/3.12
#
# Deliberately NOT done here:
#   * no `npm ci` / `npm install` / `npm run build`, no node server on
#     cPanel: the frontend arrives prebuilt as committed `frontend/dist/`
#     (the current host imposes a process/thread limitation that makes
#     esbuild unreliable — a hosting operational constraint, not a
#     MicroChess architecture limitation). If a future host allows
#     server-side builds, only this file and the dist-in-git decision
#     change — no frontend/backend rewrite is needed.
#   * no secrets: `.env` files, database files, and credentials are
#     NEVER copied (not in the clone: gitignored) and live outside the
#     replaced code paths (see safety invariants below).
#   * no database migrations run here: schema setup is idempotent and
#     runs once at Passenger process startup (passenger_wsgi.py);
#     nothing here touches production data.
#
# Safety invariants (all hold by construction below):
#   * only explicit code paths are replaced (`backend/app`,
#     `backend/static`, `backend/__pycache__`, `docs`) — the backend
#     directory itself is NEVER `rm -rf`'d, so a `.env`, database file,
#     or anything else living beside the code can never be deleted.
#   * the virtualenv lives outside the deployment code dirs and is only
#     used to run `pip` (never modified structurally by this script).
#   * never deployed: `.git`, databases, `.env` files, `node_modules`,
#     `frontend/src`, backend `tests/`, or colocated `*.test.*`.
---
deployment:
  tasks:
    # Deployment root for the kevitir account.
    - export DEPLOYPATH=/home/kevitir/microchess
    # Replace code paths only (never the backend dir itself, so `.env`
    # files or databases beside the code survive every deploy).
    - /bin/rm -rf "$DEPLOYPATH/backend/app" "$DEPLOYPATH/backend/static" "$DEPLOYPATH/backend/__pycache__" "$DEPLOYPATH/docs"
    - /bin/mkdir -p "$DEPLOYPATH/backend" "$DEPLOYPATH/docs"
    # Backend runtime: FastAPI app, Passenger WSGI entry point (exposes
    # `application`), packaging metadata, deterministic requirements
    # mirror, and the env template (reference only, never configuration).
    - /bin/cp -r backend/app "$DEPLOYPATH/backend/app"
    - /bin/cp backend/passenger_wsgi.py backend/pyproject.toml backend/requirements.txt backend/.env.example "$DEPLOYPATH/backend/"
    # Prebuilt frontend bundle (committed `frontend/dist/`, built locally
    # with same-origin API). Served by FastAPI with SPA fallback — see
    # backend/app/core/frontend.py. Replacing the whole dir (hashed
    # filenames) guarantees no stale assets survive a deploy.
    - /bin/cp -r frontend/dist "$DEPLOYPATH/backend/static"
    # Documentation and repo notes.
    - /bin/cp -r docs "$DEPLOYPATH/docs"
    - /bin/cp README.md AGENTS.md "$DEPLOYPATH/"
    # Remove the legacy Phase-13 frontend source copy (unused at runtime
    # since the prebuilt bundle moved to backend/static).
    - /bin/rm -rf "$DEPLOYPATH/frontend"
    # Python dependencies (virtualenv path operator-confirmed):
    # idempotent — pip skips satisfied requirements, so this is a cheap
    # no-op unless requirements.txt changed. A wrong path fails the
    # deploy loudly instead of booting half-installed.
    - /home/kevitir/virtualenv/microchess/backend/3.12/bin/pip install -r "$DEPLOYPATH/backend/requirements.txt"
    # Reload the Passenger application so the new code takes effect on
    # the next request. `tmp/restart.txt` is the standard Passenger
    # restart marker; touching it never restarts per request and cannot
    # loop (Passenger restarts at most once per touch).
    - /bin/mkdir -p "$DEPLOYPATH/backend/tmp"
    - /bin/touch "$DEPLOYPATH/backend/tmp/restart.txt"
