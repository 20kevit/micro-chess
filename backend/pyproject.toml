[project]
name = "microchess-backend"
version = "0.1.0"
description = "MicroChess backend foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "python-chess>=1.9",
  "python-multipart>=0.0.9",
  "email-validator>=2.0",
  # Streaming decompression for the offline Lichess puzzle ingestion
  # pipeline only (app.tools.lichess_puzzles). Ships manylinux wheels
  # for Python 3.12, so no compiler toolchain is needed on the host.
  # Never imported by the FastAPI runtime.
  "zstandard>=0.22",
  # ASGI-to-WSGI bridge for the cPanel Passenger entry point
  # (backend/passenger_wsgi.py). Pure Python, no native build.
  "a2wsgi>=1.10",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
